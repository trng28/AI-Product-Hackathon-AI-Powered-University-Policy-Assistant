name: vinuni-policy-assistant

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
      - path: ./src/.env
        required: false
    environment:
      INDEX_DIR: /app/data/policy-index
      HF_HOME: /home/app/.cache/huggingface
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://127.0.0.1:8000/api/health"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  huggingface_cache:
